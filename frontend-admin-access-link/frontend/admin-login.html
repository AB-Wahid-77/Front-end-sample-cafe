<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Amber &amp; Ash</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="brand"><span class="bean" style="color:var(--gold);">◐</span>&nbsp;Amber &amp; Ash</div>
    <p class="sub">Admin Control Panel</p>

    <form id="admin-login-form" novalidate>
      <div class="field">
        <label for="al-email">Email <span class="req">*</span></label>
        <input type="email" id="al-email" autocomplete="username">
        <span class="error-msg"></span>
      </div>
      <div class="field">
        <label for="al-password">Password <span class="req">*</span></label>
        <input type="password" id="al-password" autocomplete="current-password">
        <span class="error-msg"></span>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="admin-login-btn">Log In</button>
    </form>

    <p style="text-align:center;margin-top:22px;font-size:.82rem;">
      <a href="index.html" style="color:var(--text-soft);">← Back to the site</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin-auth.js"></script>
<script>
  /* If an admin session already exists, skip straight to the dashboard
     rather than showing the login form again. */
  (async () => {
    await restoreAdminSession();
    if(currentAdmin){
      window.location.href = "admin-dashboard.html";
    }
  })();

  document.getElementById("admin-login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const emailEl = document.getElementById("al-email");
    const passwordEl = document.getElementById("al-password");
    const btn = document.getElementById("admin-login-btn");

    const emailField = emailEl.closest(".field");
    const passwordField = passwordEl.closest(".field");
    emailField.classList.remove("error");
    passwordField.classList.remove("error");

    let hasError = false;
    if(!emailEl.value.trim()){
      emailField.classList.add("error");
      emailField.querySelector(".error-msg").textContent = "Email is required.";
      hasError = true;
    }
    if(!passwordEl.value){
      passwordField.classList.add("error");
      passwordField.querySelector(".error-msg").textContent = "Password is required.";
      hasError = true;
    }
    if(hasError) return;

    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = "Logging in…";

    try{
      const res = await API.loginAdmin({ email: emailEl.value.trim(), password: passwordEl.value });
      setAdminToken(res.data.token);
      window.location.href = "admin-dashboard.html";
    }catch(err){
      // Same generic message the backend returns for any credential
      // failure — never reveal whether the email exists.
      passwordField.classList.add("error");
      passwordField.querySelector(".error-msg").textContent = err.message;
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });
</script>
</body>
</html>
